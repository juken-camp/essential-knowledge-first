<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>教科書を読むまえの教養</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+JP:wght@400;700;900&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #FAF6F0;
  --card: #FFFFFF;
  --text: #2C2416;
  --sub: #7A6F60;
  --accent: #B85C38;
  --accent2: #E0A370;
  --accent-bg: #FDF0E6;
  --green: #5A7A5A;
  --green-bg: #EDF3ED;
  --border: #E4DDD2;
  --shadow: 0 2px 16px rgba(44,36,22,.06);
  --r: 14px;
  --serif: 'Noto Serif JP', serif;
  --sans: 'Zen Kaku Gothic New', sans-serif;
}
* { margin:0; padding:0; box-sizing:border-box; }
html { scroll-behavior: smooth; }
body {
  font-family: var(--sans);
  background: var(--bg);
  color: var(--text);
  line-height: 1.9;
  -webkit-font-smoothing: antialiased;
}

/* Progress bar */
.progress-bar {
  position: fixed; top:0; left:0; height:3px; background: linear-gradient(90deg, var(--accent), var(--accent2));
  z-index:1000; transition: width .15s; width:0;
}

/* Header */
.hdr {
  position: sticky; top:0; z-index:100;
  background: rgba(250,246,240,.92);
  backdrop-filter: blur(16px);
  border-bottom: 1px solid var(--border);
  transition: box-shadow .3s;
}
.hdr.sc { box-shadow: 0 2px 20px rgba(0,0,0,.06); }
.hdr-in {
  max-width: 820px; margin:0 auto; padding:10px 16px;
  display: flex; align-items: center; gap:12px;
}
.logo {
  font-family: var(--serif); font-weight:900; font-size:15px;
  color: var(--accent); white-space: nowrap; flex-shrink:0;
  letter-spacing: .02em;
}
.logo-icon { font-size:18px; margin-right:4px; }
.sbox { flex:1; max-width:240px; position:relative; }
.sbox input {
  width:100%; padding:7px 12px 7px 32px;
  border:1.5px solid var(--border); border-radius:10px;
  background: var(--card); font-family: var(--sans); font-size:13px;
  color: var(--text); outline:none; transition: border .2s, box-shadow .2s;
}
.sbox input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(184,92,56,.08); }
.sbox::before {
  content:'🔍'; position:absolute; left:9px; top:50%;
  transform:translateY(-50%); font-size:12px; pointer-events:none;
}
.ftog { display:flex; gap:2px; background:rgba(0,0,0,.04); border-radius:8px; padding:2px; }
.ftog button {
  border:none; background:0; font-family:var(--sans); font-size:11px;
  padding:3px 10px; border-radius:6px; cursor:pointer; color:var(--sub); transition:all .2s;
}
.ftog button.on { background:var(--card); color:var(--text); box-shadow:0 1px 4px rgba(0,0,0,.07); }

/* Layout */
.wrap {
  max-width:820px; margin:0 auto; padding:20px 16px 80px;
  display:flex; gap:28px;
}
.side {
  width:210px; flex-shrink:0; position:sticky; top:60px;
  max-height:calc(100vh - 72px); overflow-y:auto; scrollbar-width:thin;
}
.side::-webkit-scrollbar { width:3px; }
.side::-webkit-scrollbar-thumb { background:var(--border); border-radius:3px; }
.side-t {
  font-family:var(--serif); font-size:11px; font-weight:700;
  color:var(--sub); margin-bottom:8px; padding-left:10px; letter-spacing:.08em;
  text-transform:uppercase;
}
.toc { list-style:none; }
.toc .part-label {
  font-family:var(--serif); font-size:10.5px; font-weight:900;
  color:var(--accent); padding:12px 10px 4px; letter-spacing:.04em;
}
.ti {
  display:block; padding:5px 10px; font-size:11.5px; color:var(--sub);
  cursor:pointer; border-radius:8px; border-left:2.5px solid transparent;
  transition:all .15s; line-height:1.5;
}
.ti:hover { background:rgba(0,0,0,.03); color:var(--text); }
.ti.on { background:var(--accent-bg); color:var(--accent); border-left-color:var(--accent); font-weight:700; }

.main { flex:1; min-width:0; }

/* Part headers */
.part-hd {
  padding:22px 4px 10px;
  font-family:var(--serif); font-weight:900; font-size:14px;
  color:var(--accent); letter-spacing:.04em;
  display:flex; align-items:center; gap:8px;
}
.part-hd::after {
  content:''; flex:1; height:1px;
  background:linear-gradient(90deg, var(--border), transparent);
}

/* Chapter cards */
.ch {
  background:var(--card); border-radius:var(--r);
  border:1px solid var(--border); margin-bottom:14px;
  overflow:hidden; box-shadow:0 1px 6px rgba(0,0,0,.02);
  transition:box-shadow .25s, transform .25s;
}
.ch:hover { box-shadow:var(--shadow); transform:translateY(-1px); }
.ch-h {
  padding:16px 20px; cursor:pointer;
  display:flex; align-items:flex-start; justify-content:space-between;
  gap:10px; user-select:none;
}
.ch-h h3 { font-family:var(--serif); font-size:15px; font-weight:700; line-height:1.55; }
.ch-num {
  display:inline-flex; align-items:center; justify-content:center;
  min-width:22px; height:22px; padding:0 7px; border-radius:11px;
  font-size:10px; font-weight:700; color:#fff; flex-shrink:0; margin-right:8px;
}
.num-intro { background: var(--accent); }
.num-p1 { background: #B85C38; }
.num-p2 { background: #5A7A5A; }
.num-p3 { background: #7B6AAF; }
.num-p4 { background: #4A90A4; }
.num-p5 { background: #A47A4A; }
.num-outro { background: var(--accent); }

.chv {
  font-size:14px; color:var(--sub); transition:transform .3s;
  flex-shrink:0; margin-top:3px; opacity:.5;
}
.ch.op .chv { transform:rotate(180deg); opacity:.8; }
.ch-b { max-height:0; overflow:hidden; transition:max-height .45s ease; }
.ch-bi { padding:0 20px 22px; }
.ch-bi p {
  font-size:15px; line-height:2.05; margin-bottom:14px;
  text-align:justify; color:#3A3228;
}
.ch-bi p:last-child { margin-bottom:0; }
.ch-bi strong { font-weight:700; color:var(--accent); }

/* Search overlay */
.sov {
  display:none; position:fixed; inset:0; z-index:200;
  background:rgba(44,36,22,.25); backdrop-filter:blur(6px);
}
.sov.show { display:flex; justify-content:center; padding-top:70px; }
.sr {
  background:var(--card); border-radius:var(--r);
  width:92%; max-width:540px; max-height:68vh; overflow-y:auto;
  box-shadow:0 10px 40px rgba(0,0,0,.15);
}
.sr-hd {
  padding:14px 18px; border-bottom:1px solid var(--border);
  display:flex; align-items:center; justify-content:space-between;
}
.sr-hd h4 { font-size:13px; color:var(--sub); }
.sr-hd button { border:none; background:none; font-size:18px; cursor:pointer; color:var(--sub); }
.sr-i { padding:12px 18px; border-bottom:1px solid rgba(0,0,0,.04); cursor:pointer; transition:background .15s; }
.sr-i:hover { background:var(--accent-bg); }
.sr-i .t { font-size:13px; font-weight:700; margin-bottom:3px; }
.sr-i .s { font-size:12px; color:var(--sub); line-height:1.65; }
.sr-i .s mark { background:rgba(184,92,56,.12); color:var(--accent); font-weight:700; padding:0 2px; border-radius:2px; }
.no-r { padding:28px; text-align:center; color:var(--sub); font-size:13px; }

/* Font sizes */
body.fs-s .ch-bi p { font-size:13.5px; line-height:1.9; }
body.fs-l .ch-bi p { font-size:16.5px; line-height:2.2; }

/* Mobile */
@media(max-width:768px) {
  .side { display:none; }
  .wrap { padding:12px 10px 60px; }
  .hdr-in { padding:8px 10px; }
  .sbox { max-width:150px; }
  .ftog { display:none; }
  .ch-h { padding:14px 14px; }
  .ch-bi { padding:0 14px 16px; }
  .ch-bi p { font-size:14.5px; }
}

/* Animations */
@keyframes fadeUp {
  from { opacity:0; transform:translateY(14px); }
  to { opacity:1; transform:translateY(0); }
}
.ch { animation: fadeUp .4s ease both; }
</style>
</head>
<body>
<div class="progress-bar" id="pb"></div>

<header class="hdr" id="hdr">
  <div class="hdr-in">
    <div class="logo">教科書を読むまえの教養</div>
    <div class="sbox"><input type="text" id="si" placeholder="キーワードで検索…" autocomplete="off"></div>
    <div class="ftog">
      <button data-s="s">小</button>
      <button data-s="n" class="on">中</button>
      <button data-s="l">大</button>
    </div>
  </div>
</header>

<div class="sov" id="sov">
  <div class="sr">
    <div class="sr-hd"><h4 id="sc"></h4><button id="cs">✕</button></div>
    <div id="srl"></div>
  </div>
</div>

<div class="wrap">
  <aside class="side" id="side">
    <div class="side-t">📖 もくじ</div>
    <ul class="toc" id="toc"></ul>
  </aside>
  <main class="main" id="main"></main>
</div>

<script>
const DATA = [
  {
    "num":"1","title":"この世界は「知っている人」が有利にできている",
    "part":"序章　世界のルールを知る","partColor":"num-intro",
    "body":"突然ですが、ひとつ質問です。あなたは毎月、スマホにいくら払っていますか。もし答えられないなら、それはちょっと危ない状態です。\n\n世の中には、同じスマホを使っていても月3,000円の人と月10,000円の人がいます。性能の差ではありません。「料金プランの選び方を知っているかどうか」。たったそれだけの違いで、**年間84,000円の差**がつきます。中学3年間で25万円以上。**知っているか、知らないか。それだけの話**なんです。\n\nもっと大きな話もあります。世の中には「リボ払い」という仕組みがあります。クレジットカードの支払い方法のひとつで、いくら買い物をしても毎月の支払いを一定額（たとえば5,000円ずつ）にできるから楽に見えます。でも裏では年利（ねんり）15%（年間で15%ぶんの利子がつく）もの利子がかかる。10万円の買い物を毎月5,000円ずつ返すと、最終的に約13万円払うことになります。**3万円が「知らなかったこと」への罰金**みたいなものです。\n\nこれはお金の話だけではありません。法律を知らなければ自分の権利を守れません。政治の仕組みを知らなければ、だれかに都合よく動かされても気づけません。仕事の選び方を知らなければ、自分に合わない場所で何十年も苦しむかもしれません。\n\n**「知らない」ということは「選べない」ということです。**選択肢が見えなければ、選ぶことすらできません。逆に、知っていれば選べます。選べるということは、**自分の人生を自分でコントロールできる**ということです。\n\nこの本は「世の中のルール」を教えるための本です。学校の教科書に書いてある知識ではなく、教科書を読む前に知っておいてほしい「世の中の仕組み」の話。\n\nべつに全部を暗記する必要はありません。「へえ、世の中ってこうなってるんだ」。その「へえ」が増えるたびに、あなたの見える世界は広がっていきます。そして見える世界が広がれば、**人生の選択肢も増えていく**んです。"
  },
  {
    "num":"2","title":"学校の勉強は何の役に立つのか——本当の答え",
    "part":"序章　世界のルールを知る","partColor":"num-intro",
    "body":"「数学なんて大人になって使わないじゃん」。正直に言います。これ、半分は当たっています。二次方程式（にじほうていしき＝x²のような、2乗が入った方程式）を日常で解く大人はほとんどいません。古文の文法を仕事で使う場面もまずありません。歴史の年号を暗記していなくても生活に困りません。\n\nじゃあ勉強は意味がないのか。いや、意味はあります。ただしその意味は**「知識を覚えること」ではない**んです。\n\nたとえば筋トレをしている人がいるとします。その人がダンベルを持ち上げているのは「ダンベルを持ち上げる技術」を磨くためではありません。筋力をつけるためです。数学も同じで、問題を解いているのは数学ができるようになるためだけではなく**「論理的に考える力」を鍛えている**んです。「AだからB、BだからC、ということはAならC」。この考え方は友達とのトラブル解決にも、仕事の判断にも、ウソを見抜くときにも使えます。\n\n国語は**「相手の言いたいことを正確に読み取る力」と「自分の考えを正確に伝える力」**を鍛えます。これは人間関係のすべてに直結する力です。就職の面接でも、恋愛の告白でも、LINEのやりとりでも。\n\nでも、本当に大事なことを言います。学校の勉強よりもっと大事な「学び」があります。それは**「学び方を学ぶ」**ことです。\n\n知りたいことをどう調べるか。情報が正しいかどうかどう判断するか。わからないことを人にどう質問するか。これが「学び方」であり、**一生使えるスキル**です。\n\nスマホが手元にある時代、知識そのものの価値は下がっています。調べればすぐ出てくるから。でも「何をどう調べればいいか」は、調べ方を知らないと調べられません。学校の勉強は、この「調べ方」「考え方」「伝え方」を練習する場なんです。\n\nそしてもうひとつ。学ぶことは本来楽しいことです。人間の脳は新しいことを知ったとき「なるほど！」と快感を覚えるようにできています。脳の中で「ドーパミン（脳の中で出る、気持ちよくなる物質）」が出る。つまり「わかった！」の瞬間は、脳にとってはごほうびなんです。勉強がつまらないと感じるのは、たいてい「やらされている」から。**自分で「知りたい」と思ったことを調べるのは、びっくりするほど楽しい**ものです。"
  },
  {
    "num":"3","title":"お金の正体——なぜ紙切れに価値があるのか",
    "part":"第1部　お金のルール","partColor":"num-p1",
    "body":"お金がない世界を想像できますか。\n\n大昔、人間はお金なしで暮らしていました。「物々交換（ぶつぶつこうかん）」、つまり「モノとモノを直接とりかえっこする」やり方です。「私の魚とあなたの米を交換しよう」。シンプルに見えますが、これがとんでもなく不便でした。\n\n問題は「欲望の二重の一致（にじゅうのいっち）」です。むずかしい名前ですが、中身はかんたんです。つまり「交換が成立するには、お互いが相手の持っているものを欲しいと思わないといけない」ということ。あなたが魚を持っていて靴が欲しいのに、靴屋さんが「魚はいらない」と言ったらアウトです。別のだれかを何段階も経由して……気が遠くなりますよね。\n\nそこで人間は「みんなが価値があると認めるもの」を間に挟むことを思いつきました。これがお金の発明です。最初は貝殻、塩、布、家畜（かちく＝人間が飼っている動物）。やがて金や銀、硬貨（こうか）、紙幣（しへい＝紙でできたお金）。「貝」という字が「財」「貯」「買」「貨」など、お金に関する漢字に含まれているのは、昔は本当に貝がお金だった名残（なごり）です。\n\nここで大事なことがあります。**お金そのものには価値がない**んです。千円札はただの紙で、原価は数十円です。でも日本中の人が「これは千円の価値がある」と信じているから千円として使えます。つまり**お金の正体は「信用」**なんです。\n\nこの信用が崩れるとどうなるか。第一次世界大戦後（だいいちじせかいたいせんご）のドイツでは**パン1個買うのにリヤカーいっぱいの紙幣が必要**になりました。子どもたちが札束を積み木がわりにして遊んでいた写真が残っています。信用がなくなると、紙幣はただの紙に戻るんです。これを「ハイパーインフレ（物の値段が異常な速さで上がり続けること）」と言います。\n\n今、お金のかたちはさらに変わりつつあります。PayPayで「ピッ」と払い、銀行口座はスマホの数字。暗号資産（ビットコインなど、インターネット上だけで使われるお金）のように、国が発行したわけでもないお金まで登場しました。\n\nお金という言葉から連想するのは硬貨や紙幣かもしれませんが、その正体は「みんなの信用」です。目に見えないものが世界を動かしている。考えてみると、ちょっとすごいことだと思いませんか。\n\nそしてもうひとつ。お金は便利な道具ですが、あくまで道具です。**幸せに生きるための手段であって、それ自体が目的ではない。**この区別を忘れると、お金に振り回される人生になってしまいます。"
  },
  {
    "num":"4","title":"値段のカラクリ——なぜあの商品は高くて、これは安いのか",
    "part":"第1部　お金のルール","partColor":"num-p1",
    "body":"マクドナルドのハンバーガーは200円くらいです。でもホテルのレストランのハンバーガーは3,000円だったりします。15倍。肉も野菜もパンも使っていて、見た目もそこまで変わらないのに。なぜこんなに違うんでしょうか。\n\n答えは「値段は材料費だけで決まるわけではない」からです。\n\nホテルのハンバーガーには、きれいな空間、丁寧な接客、ブランドの信頼、「特別な体験」というものが含まれています。あなたが払っているのは**「ハンバーガー＋体験」のセット代金**なんです。\n\nでは値段はどうやって決まるのか。ここで知っておいてほしいのが**「需要と供給（じゅようときょうきゅう）」**という考え方です。需要は「欲しいと思う人の数」、供給は「お店に出まわるモノの数」のこと。シンプルに言うと「欲しい人が多くてモノが少なければ値段は上がる」「欲しい人が少なくてモノが多ければ値段は下がる」。これだけです。\n\n夏にかき氷は売れますが、冬はあまり売れません。だから夏のほうが値段が高くなります。人気の限定スニーカーが定価（ていか＝もともとの値段）の10倍で転売（てんばい＝買ったものを高く売ること）されるのも、「欲しい人が多すぎるのにモノが少ない」から。コロナ禍にマスクが品薄（しなうす＝モノが足りない状態）になったとき値段が跳ね上がったのも同じ理屈です。\n\nよくネットで「これ、原価100円なのに1,000円で売るのはぼったくりだ」という人がいます。でもそれはちょっと違います。原価（げんか＝作るのにかかったお金）のほかに、作った人の人件費（じんけんひ＝働く人に払うお給料）、お店の家賃、電気代、広告費、運送費、そして利益が乗っています。その全部がなければお店は潰れるし、商品はあなたの手元に届きません。\n\n100円ショップの商品が安いのには理由があります。大量に作って1個あたりのコストを下げ、人件費の安い国で製造し、お店の内装にお金をかけない。どこかでコストを削っているんです。**「安いものには理由がある」し「高いものにも理由がある」。**値段の裏側には必ずカラクリがあります。\n\n値段の仕組みがわかると、買い物の見え方が変わります。「なぜこれはこの値段なんだろう」と考えるクセがつくと、無駄な買い物が減ります。それだけで、一生でかなりの金額を節約できるはずです。"
  },
  {
    "num":"5","title":"お金を増やす人、減らす人——投資・借金・複利の話",
    "part":"第1部　お金のルール","partColor":"num-p1",
    "body":"お年玉を銀行に預けたことはありますか。通帳を見ても利息はほぼゼロ。100万円を1年預けても、もらえる利息はたった10円ほど。缶ジュースも買えません。\n\nでも、同じ100万円でも置き場所を変えると全然違う結果になります。ここで登場するのが「投資」です。\n\n投資とは、お金を「成長しそうなもの」に預けて、増やしてもらうこと。たとえば会社に投資する「株（かぶ）」。あなたが応援したい会社の株を買うと、会社が成長すれば株の価値も上がります。日本全体の株価（かぶか）を示す指数（しすう＝全体の流れを数字で表したもの）は過去30年で何倍にもなっています。もちろん下がることもあるのでリスクはありますが、長期で見ると経済は成長してきた歴史があります。\n\n「投資とギャンブルの違いは何？」という疑問を持つ人もいるでしょう。競馬やパチンコは、長く続ければ続けるほどお金が減る仕組みになっています。一方、**投資は長く続けるほどお金が増える確率が上がる**ものです。もちろんリスクはゼロではありませんが、構造がまったく違います。\n\nここで**「複利（ふくり）」**の話をさせてください。複利とは**「利益にもさらに利益がつく」**仕組みです。たとえば100万円を預けて5万円の利息がついたら、次の年は105万円に対して利息がつく。雪だるまのように増えていく仕組みです。18歳から毎月5,000円を年利5%で積み立てると、60歳で約855万円になります。元本（もともと自分が出したお金）は252万円なのに、約600万円が複利で増えた分です。同じことを30歳から始めると約415万円。**たった12年の差で440万円も違う。これが複利の力であり「時間を味方につける」**ということです。\n\n逆に、**複利が敵になるのが「リボ払い」**です。年利15%で複利が働く。10万円のリボ払いを最低額で返し続けると、返済総額は13万円以上になることもあります。お金を増やす側で複利が味方になり、借金では複利が敵になる。同じ仕組みなのに立場によって正反対。だからこの仕組みを知っているかどうかが大事なんです。\n\n「借金＝悪」とも限りません。家を買うための住宅（じゅうたく）ローン、スキルを身につけるための奨学金（しょうがくきん＝学校に通うためのお金を借りる制度）。将来のリターン（見返り、つまり「あとで得するもの」）がある借金は「投資」に近い。大事なのは**「良い借金」と「悪い借金」を区別できる目を持つ**ことです。"
  },
  {
    "num":"6","title":"税金はどこへ消えるのか",
    "part":"第1部　お金のルール","partColor":"num-p1",
    "body":"コンビニで110円のおにぎりを買うと、そのうち10円が消費税として国に行きます。「たった10円」と思うかもしれませんが、日本中で毎日何千万件もの買い物が行われていて、消費税全体では**年間約25兆円**になります。25兆円です。\n\n税金にはたくさんの種類があります。消費税のほかに、所得税（しょとくぜい＝給料にかかる税金）、住民税（じゅうみんぜい＝住んでいる地域に払う税金）、法人税（ほうじんぜい＝会社の利益にかかる税金）など。将来あなたが働き始めると「給料の額面（がくめん＝書いてある金額）」と「手取り（てどり＝実際にもらえる金額）」の差に驚くはずです。月給20万円でも、**手取りは16万円くらい。約4万円が税金と社会保険料で引かれます。**\n\nでは、集めた税金は何に使われているのでしょうか。いちばん多いのは**「社会保障費（しゃかいほしょうひ）」で、全体の約3分の1**を占めます。これは年金（お年寄りに毎月届くお金）、医療（病院にかかるときの補助）、介護（かいご＝お年寄りの生活を支える仕組み）、子育て支援（しえん）などに使われます。次に多いのが「国債（こくさい）の返済」。国債というのは、国がお金を借りたときの借用書のようなもので、つまり国の借金を返すお金です。その次が教育や防衛（ぼうえい＝国を守ること）、公共事業（こうきょうじぎょう＝道路や橋を作るなどの工事）など。\n\nあなたが毎日通っている道路、学校の建物、図書館、公園。ぜんぶ税金で作られています。救急車を呼んでもお金がかからないのも、消防車が火事を消してくれるのも税金のおかげです。\n\n「税金は高すぎる、もっと安くしろ」という声はよく聞きます。気持ちはわかります。でも税金を減らせばそのぶんサービスが減ります。北欧（ほくおう＝ヨーロッパの北のほう）のスウェーデンは消費税が25%と高いですが、教育費は大学まで無料、医療費もほぼ無料、育児休暇（いくじきゅうか＝子育てのためにお休みをもらえる制度）も充実（じゅうじつ）しています。「税金が高い＝悪い」とは限らないんです。\n\n逆にアメリカは税金が比較的安いですが、救急車を呼ぶだけで何十万円もかかることがあります。盲腸（もうちょう）の手術で数百万円の請求が来る国です。\n\n大事なのは「税金をいくら集めるか」だけでなく**「集めた税金をどう使うか」**です。そしてそれを決めるのは政治家であり、その政治家を選ぶのは私たちです。税金の使い道に文句を言うなら、選挙に行くのがいちばん確実な方法です。"
  },
  {
    "num":"7","title":"なぜ格差は広がるのか——生まれた場所で人生が変わる問題",
    "part":"第1部　お金のルール","partColor":"num-p1",
    "body":"世界には約82億人の人間が暮らしています。そのうち約7億人が、**1日300円以下で生活**しています。300円。あなたの昼食1回分で、1日を生き延びなければならない人がそれだけいるんです。\n\nなぜこんな差があるのでしょう。「努力が足りないから」でしょうか。\n\nそんな単純な話ではありません。まず歴史があります。15世紀以降、ヨーロッパの国々はアフリカ、アジア、南米を植民地（しょくみんち）にしました。植民地というのは、強い国が弱い国や地域を力ずくで支配して、自分たちのものにしてしまうことです。金や銀やダイヤモンドを奪い、人を奴隷（どれい＝人間を持ち物のように扱うこと）として連行し、自国を豊かにした。先進国の豊かさの土台には、そういう歴史があります。\n\n植民地支配が終わったあとも、構造は残りました。途上国（とじょうこく＝これから発展していく国）は安いコーヒー豆やカカオを輸出（ゆしゅつ＝外国に売ること）して、先進国が作った高い車やスマホを買う。この構造ではいくら働いても差は縮まりにくい。\n\n日本国内にも格差はあります。データを見ると、**親の年収が高い家庭の子どもほど大学進学率が高い**という関係が見られます。年収400万円以下の家庭の大学進学率は約30%。年収1000万円以上だと約60%。同じ能力を持った子でも、**生まれた家庭の経済力で選択肢が変わってしまう**現実があるんです。\n\n「自己責任」という言葉をよく聞きます。「努力しなかったから貧しいんだ」と。でも**生まれる国、生まれる家庭、生まれる時代は自分では選べません。**自分では選べない条件で人生が大きく左右される。これを「自己責任」のひと言で片付けるのは、ちょっと乱暴ではないでしょうか。\n\nだからといって「どうせ何をやっても無駄」というわけでもありません。格差を完全になくすことは難しくても、**知識は格差を超えるための武器**になります。お金がなくても、スマホひとつで世界中の知識にアクセスできる時代です。無料の教材も、無料の講義も、山ほどあります。\n\n大事なのは、この格差が**「自然現象」ではなく「人間が作った仕組みの結果」**だと理解することです。人間が作ったものなら、人間が変えることもできるはずです。"
  },
  {
    "num":"8","title":"人間が「社会」を発明した日",
    "part":"第2部　社会と政治のルール","partColor":"num-p2",
    "body":"もしこの世界にあなたしかいなかったら、どうなるでしょう。\n\n食べ物は自分で狩りをして、自分で野菜を育てて、自分で調理する。服は自分で綿花を育てるところから始めないといけません。病気になったら自分で薬草を探す。スマホはもちろん、電気すらない。\n\nひとりの人間にできることには限界があります。だから人間は集まりました。集まって役割を分けたんです。「あなたは狩りが得意だから食料を取ってきて。私は手先が器用だから道具を作る」。これが**「分業（ぶんぎょう）」の始まりであり、「社会」の始まり**です。\n\nあなたが毎日食べているお弁当ひとつとっても、お米を育てた農家さん、おかずを加工した人、トラックで運んだ人、お店に並べた人——何十人もの人の仕事が重なっています。コンビニのおにぎり1個ですら、稲を育て、収穫し、握り、包装し、配送し、棚に並べる、という長い連携の末にあなたの手に届いています。\n\nところが、人が集まると必ず問題が起きます。意見がぶつかる。「この肉は俺が取ったんだから俺のもの」「いや、みんなで分けるべきだ」。力が強い者が全部取るなら、それは**弱肉強食（じゃくにくきょうしょく）であって社会ではありません。**\n\nそこで「ルール」が必要になりました。最初は口約束で、やがて文字に書き起こされて法律になり、ルールを管理するリーダーが現れ、リーダーが治める範囲が国になりました。\n\nここで大事なことがひとつあります。**社会のルールは自然にあったものではなく、人間が作ったものだということです。人間が作ったものだから、人間が変えることもできます。**「これはおかしい」と思ったら声を上げて変えていい。\n\n実際、人類はずっとそうやってきました。奴隷制度も、女性に選挙権がないことも、かつては「あたりまえ」でした。「それはおかしい」と立ち上がった人がいたから変わったんです。社会は完成品ではなく、まだ作りかけです。**そしてこれから作っていくのはあなたたちの世代です。**"
  },
  {
    "num":"9","title":"法律は正義か——ルールの「向こう側」を考える",
    "part":"第2部　社会と政治のルール","partColor":"num-p2",
    "body":"「法律を守りなさい」。あたりまえのことのように聞こえます。でも、法律は本当にいつも正しいのでしょうか。\n\nかつてアメリカには「黒人は白人と同じバスの席に座ってはいけない」という法律がありました。南アフリカでは人種隔離政策（じんしゅかくりせいさく）の「アパルトヘイト」——白人と黒人の住む場所や学校、乗れるバスまでぜんぶ分ける——が法律で定められていました。ナチス・ドイツではユダヤ人への迫害（はくがい＝ひどい仕打ちをすること）が合法（ごうほう＝法律的にOKということ）でした。ぜんぶ「法律」だったんです。\n\n法律だからといって正しいとは限りません。法律は人間が作ったものだから、間違うこともあります。権力者が自分に都合のいい法律を作ることだってあります。**「合法」と「正義」はイコールではない**んです。\n\n1955年、ローザ・パークスという黒人女性が、法律に逆らってバスの白人専用席に座り続けました。逮捕されましたが、この行動がきっかけで全米にバスボイコット運動（バスに乗らないことで抗議する運動）が広がり、最終的に人種分離法（じんしゅぶんりほう＝人種で人を分けるための法律）は廃止（はいし＝なくすこと）されました。**ひとりの「座り続ける」という行為が、国を変えた**んです。\n\n一方で「法律が気に入らないから無視していい」とはなりません。信号を無視していいか個人の判断に任せたら大変なことになります。法律は社会の秩序（ちつじょ＝社会が乱れずに保たれている状態）を守る土台です。\n\nここに「法と道徳（どうとく）のちがい」があります。**法律は「社会全体のルール」で、破れば罰がある。道徳は「個人の良心のルール」で、罰はないけれど心が痛む。**この2つはだいたい重なりますが、ズレることもあります。電車でお年寄りに席を譲らないのは法律違反ではありませんが、道徳的にはどうでしょう。\n\n校則だってそうです。「なぜこの校則があるのか」を考えたことはありますか。合理的な理由があるものもあれば、「昔からそうだから」としか言えないものもあります。\n\nルールは大事です。でもルールの**「向こう側」にある目的や正義を自分の頭で考え続けること。**盲目的（もうもくてき＝何も考えずに）に従うのでもなく、何でも無視するのでもなく「なぜこのルールがあるのか」を問える人が、よりよい社会を作っていきます。"
  },
  {
    "num":"10","title":"民主主義のバグ——多数決は本当に正しいのか",
    "part":"第2部　社会と政治のルール","partColor":"num-p2",
    "body":"「民主主義（みんしゅしゅぎ）は最悪の政治形態（せいじけいたい＝政治のやり方）だ。ただし、これまで試みられた他のすべての政治形態を除けば」。イギリスの首相チャーチルの有名な言葉です。\n\n民主主義とは「国のことをみんなで決める」しくみです。すばらしく聞こえますが、弱点もたくさんあります。\n\nまず**「多数決の罠（わな）」**です。49%の人が反対しても、51%が賛成すれば通ってしまう。つまり、半分近くの人が「いやだ」と思っていても、ほんの少しの差で決まってしまうんです。少数派（数が少ないほう）の声が切り捨てられる危険があります。クラスの多数決で修学旅行先を決めたとき、経済的に旅行代を払えない生徒がいたら。多数決は万能ではありません。\n\n次に**「ポピュリズム」（大衆迎合主義）**のリスクです。ポピュリズムとは、わかりやすい言葉で「あなたたちの味方です！」「悪いのはあいつらだ！」と叫んで、人々の感情に訴えかけるやり方のことです。よく考えずに投票すると、中身のある政策はないけど演説がうまい、SNSで人気がある、という理由だけでリーダーが選ばれてしまいます。**政策の良し悪しではなく「見栄え」や「ノリ」で決まる政治。これは世界中で実際に起きている問題です。**\n\n「遅い」という弱点もあります。独裁国家（ひとりの人間がすべてを決める国）はトップがすぐ決められますが、民主主義は議論と手続きが必要で時間がかかります。\n\nでは独裁のほうがいいのか。答えはNOです。独裁は「いい独裁者」がいる間はうまくいくかもしれませんが、**間違えたとき国民には止める手段がありません。**批判すれば逮捕され、選挙はなく、メディア（テレビや新聞）は政府の言いなり。\n\n**民主主義の本当の強みは「間違いを修正できること」**です。ダメなリーダーは次の選挙で交代させられます。悪い法律は改正できます。この「自己修正機能（じこしゅうせいきのう＝自分で間違いを直せる仕組み）」は独裁にはありません。\n\nただし、民主主義はタダではありません。国民が政治に関心を持ち、情報を集め、考えて、投票に行く。その手間を払い続けなければ空っぽの器になります。**民主主義は私たちが「めんどくさい」と思った瞬間から壊れ始めるものなんです。**"
  },
  {
    "num":"11","title":"あなたの1票が届かない理由——選挙と政治のリアル",
    "part":"第2部　社会と政治のルール","partColor":"num-p2",
    "body":"日本の若者（18〜29歳）の**投票率は約30%台**。10人中7人が選挙に行っていません。一方、60代以上の投票率は約70%。この差が何を意味するか、考えてみてください。\n\n政治家の仕事は「票を集めること」です。次の選挙で勝てなければ政治家でいられなくなります。だから投票してくれる人の声を優先的に聞きます。当然ですよね。\n\n60代以上がたくさん投票する。若者はほとんど投票しない。結果、政治家は高齢者向けの政策を優先します。年金は維持され、医療費の自己負担は低く抑えられます。一方で大学の学費はどんどん上がり、若者の手取りは増えず、少子化対策は後手に回ります。\n\nこれは「政治家が悪い」のではなく**「投票しない若者が自分で自分の首を絞めている」**んです。\n\n「1票で何が変わるの」という声をよく聞きます。たしかに、あなた1人が投票したかどうかで結果が変わることは稀です。でもその理屈で全員が投票しなかったら民主主義は終わりです。実は地方選挙では**1票差、数十票差で結果が変わることは珍しくありません。**\n\nもうひとつ。投票は「この人を当選させる」ためだけのものではありません。20代の投票率が上がれば、それだけで政治家は「若者を無視できない」と感じます。当選しなくても、**投票行動そのものが「若者はちゃんと見ている」というメッセージ**になるんです。\n\n「でも、どの候補者もパッとしない」。その気持ちはわかります。完璧な候補者を待っていたら一生投票できません。「一番マシな人」を選ぶだけでいいんです。100点の候補者はいなくても、0点と30点の差は大きい。\n\n税金の使い方も、学費も、働き方のルールも、ぜんぶ政治が決めています。**「政治に興味がない」は「自分の生活に興味がない」と同じことです。**あなたが投票権を持つ日は、思っているよりずっと近い。そのとき、何もわからない状態で投票用紙の前に立つのか、自分の意見を持って立つのか。その差は大きいと思います。"
  },
  {
    "num":"12","title":"人はなぜ働くのか——お金以外の理由",
    "part":"第3部　仕事と稼ぎ方のルール","partColor":"num-p3",
    "body":"「なんで大人は毎日あんなに疲れた顔で仕事に行くんだろう」。そう思ったことはありませんか。\n\nいちばんわかりやすい答えは「お金のため」です。家賃、食費、電気代、スマホ代。生きるにはお金が必要で、お金を得るには働かなくてはならない。これは紛れもない事実です。\n\nでも、もしそれだけなら、宝くじで10億円当たった人はみんな仕事をやめるはずです。実際にはやめない人が少なくありません。なぜか。\n\n人間には**「だれかの役に立ちたい」「自分の力を発揮したい」**という欲求があるからです。心理学者のマズローは、人間の欲求を5段階のピラミッドで表しました。いちばん下が「食べる・眠る」という生きるための基本的な欲求。その上が「安全に暮らしたい」。さらに「仲間に入りたい」。「認められたい」。そして頂上が**「自己実現（じこじつげん）」——自分の可能性を最大限に発揮したいという欲求**です。\n\n仕事はこの上位の欲求を満たす場にもなります。お客さんに「ありがとう」と言われたとき。チームでプロジェクトを成し遂げたとき。自分のアイデアが形になったとき。お金では測れない充実感がそこにはあります。\n\nただし、これは理想の話でもあります。現実には「仕事がつらい」「やりがいなんて感じない」という人もたくさんいます。日本は長時間労働（ちょうじかんろうどう＝長い時間働くこと）の国です。**「過労死（かろうし＝働きすぎで亡くなること）」という言葉が海外でも「Karoshi」として通じるほど深刻な問題**になっています。命を削るほど働くことが美徳（びとく＝すばらしいこと）とされてきた文化がありますが、それは本当に正しいのでしょうか。\n\n「好きなことを仕事にしろ」とよく言われますが、それができる人は限られています。大事なのは、どんな仕事であっても**「自分なりの意味」を見つけようとする姿勢**ではないでしょうか。\n\nそしてもうひとつ。**仕事だけが人生ではありません。**家族との時間、趣味、友人との語らい。「何の仕事をしているか」だけで人の価値は決まりません。"
  },
  {
    "num":"13","title":"サラリーマンだけが仕事じゃない——稼ぎ方の大変革",
    "part":"第3部　仕事と稼ぎ方のルール","partColor":"num-p3",
    "body":"「将来の夢は？」と聞かれて「会社員」と答える人は少ないと思います。でも、実際には日本の労働者の**約9割が会社員**です。ほとんどの人が、どこかの会社に入って給料をもらう生き方をしている。それが「ふつう」でした。\n\nでも今、その「ふつう」が大きく変わりつつあります。\n\nYouTuberという職業を知らない人はいないでしょう。トップクラスのYouTuberは年収が数億円です。でも大事なのは金額ではなく「仕組み」です。YouTuberの収入源は主に3つ。広告収入（動画の前や途中に流れる広告）、企業案件（きぎょうあんけん＝企業から商品を紹介してほしいと頼まれる）、そしてグッズ販売や有料会員。つまり**「自分のメディアを持ち、そこに人を集めて、お金に変える」**というビジネスモデルです。\n\nこの構造はYouTuberだけではありません。インスタグラマー、TikToker、ポッドキャスター、ブロガー。全員が同じ仕組みで稼いでいます。これを**「クリエイターエコノミー」**（個人が作ったコンテンツでお金が回る経済のこと）と呼びます。個人がコンテンツを作り、直接ファンからお金をもらう時代。会社に入らなくても稼げる時代が来ているんです。\n\neスポーツ選手（ゲームの大会で戦うプロ選手）、プロゲーマーも立派な職業（しょくぎょう）になりました。世界大会の賞金総額は数十億円規模です。ゲーム実況者は「遊んでいるだけ」に見えるかもしれませんが、実はトーク力、編集力、マーケティング力（商品やサービスを人に知ってもらい、売るための力）の塊です。\n\nフリーランス（会社に所属せず、自分の腕一本で仕事を受ける働き方）という選択肢もあります。プログラマー、デザイナー、ライター、翻訳者。場所を選ばず、自分のペースで働ける。\n\nただし、大事なことを言います。**これらの「華やかに見える仕事」で成功しているのはほんの一握り**です。YouTuberの大多数はほとんど稼げていません。フリーランスは会社員と違って保障がなく、収入も不安定です。見えている部分だけで判断すると危険です。\n\n大事なのは「会社員か、それ以外か」という二択ではなく、**稼ぎ方にはいろんな選択肢があると知っておくこと。**そして、どの道を選ぶにしても「スキル」が必要だということ。選択肢を知っているだけで、人生の設計図はまったく変わります。"
  },
  {
    "num":"14","title":"AIは敵か味方か——仕事の未来予測",
    "part":"第3部　仕事と稼ぎ方のルール","partColor":"num-p3",
    "body":"スーパーのセルフレジ、回転寿司の自動化されたキッチン、ChatGPTが書く文章。気がつけばAI（人工知能）は私たちの日常に入り込んでいます。\n\nある研究では「今ある仕事の**約半分が、将来AIやロボットに代替される可能性がある**」と予測されています。レジ係、データ入力、単純な事務作業、一部の工場作業。ルーティンワーク（毎回おなじ手順をくり返すタイプの仕事）はAIが得意な分野です。\n\nでも「AIに仕事を奪われる」という話だけでは片手落ちです。産業革命（さんぎょうかくめい＝18世紀ごろ、機械が発明されて世の中が大きく変わった時代）のとき、機械が登場して多くの職人が仕事を失いました。でも同時に、機械を扱う新しい仕事が生まれました。自動車ができたとき馬車の御者は失業しましたが、タクシードライバー、整備士、道路設計者という新しい仕事が生まれました。AIでも同じことが起きるはずです。\n\nAIにできないことは何か。これを知っておくことがとても大事です。\n\nAIは「泣いている人の横に座って、黙って一緒にいること」ができません。相手の微妙な表情を読んで、かける言葉を選ぶことが苦手です。「こうしたほうがいいけど、今はあえて言わない」という判断もできません。つまり**「共感」「信頼関係の構築」「倫理的な判断」「文脈を読む力」は人間にしかない強み**です。\n\n新しい価値を生み出す「創造性」もAIは苦手です。AIは過去のデータを組み合わせるのは得意ですが、まったく新しい発想をゼロから生むことは今のところ人間のほうが上です。\n\n大事なのは**「AIに仕事を奪われる側」ではなく「AIを使いこなす側」になること**です。ChatGPTを使って文章を書かせる人は「AIに使われている」のではなく「AIを道具として使っている」。ハサミが登場したとき「ハサミに仕事を奪われた」と言う人はいませんよね。\n\n今からできることはシンプルです。**「考える力」と「人と関わる力」を鍛えること。これはAIがどれだけ進化しても、最後まで人間に残る武器です。**"
  },
  {
    "num":"15","title":"学歴の真実——それは切り札か、それとも",
    "part":"第3部　仕事と稼ぎ方のルール","partColor":"num-p3",
    "body":"正直に話します。**学歴フィルター**（学歴で足切りされる仕組み）は存在します。\n\n大企業の採用で、ある大学以下の学生は書類選考（しょるいせんこう＝履歴書だけで合否を決める段階）で落とされることがあります。エントリーシート（就活で出す自己紹介の書類）に大学名を書いた瞬間に、読んでもらえないこともある。これは公にはされませんが、現実としてあります。\n\n「じゃあ、いい大学に行けなかったら終わりなのか」。いいえ、終わりではありません。理由を説明します。\n\n学歴は**「入場券」のひとつ**です。コンサート会場に入るためのチケットのようなもの。でも入場できたからといって、いい席に座れるわけではありません。会場に入ってからは、別の勝負が始まります。仕事の能力、コミュニケーション力、信頼性、やり抜く力。**ここでは学歴の効力はどんどん薄れていきます。**\n\nそして、学歴という入場券がなくても入れる会場はたくさんあります。学歴を重視しない会社は増えていますし、フリーランスや起業なら学歴は関係ありません。\n\n実際、中卒や高卒で大きな成功を収めた人は数え切れないほどいます。彼らに共通しているのは**「学校を出たあとも学び続けた」**ということです。本を読み、人から教わり、失敗から学び、スキルを磨き続けた。\n\nここが大事なポイントです。**「学歴がない」ことと「学ぶことをやめた」ことはまったく違います。**学歴はある時点での記録写真のようなものに過ぎません。でも「学び続ける姿勢」は一生ものの武器です。\n\n社会に出てから手に入れられる武器はたくさんあります。資格、実務経験（じつむけいけん＝実際に仕事をした経験）、専門（せんもん）スキル、人脈（じんみゃく＝信頼できる人とのつながり）、信用。どれも学歴に関係なく積み上げられるものです。特に**「信用」は最強**です。「あの人に任せれば大丈夫」と思われたら、学歴なんて誰も聞きません。\n\n今、学歴を気にするなとは言いません。使える入場券は多いほうがいい。でも、もし今の成績が振るわなくても、人生が終わったわけではまったくありません。本当の勝負は学校を出てから始まります。そしてその勝負に必要なのは**「学び続ける力」**です。"
  },
  {
    "num":"16","title":"スマホは人類史上最強の発明かもしれない",
    "part":"第4部　情報と言葉のルール","partColor":"num-p4",
    "body":"あなたのポケットに入っているスマホ。その計算能力は、**人類（じんるい）を月に送ったアポロ11号のコンピュータの数百万倍**です。\n\n20年前、同じことをしようとしたら何が必要だったか。カメラ、ビデオカメラ、地図、辞書、百科事典、電話、時計、カレンダー、音楽プレーヤー、ゲーム機、電卓、懐中電灯。全部別々に買って、合計で何十万円もかかったでしょう。それが今、数万円の端末ひとつにぜんぶ入っています。\n\nスマホがあれば、**世界中の知識にアクセスできます。**ハーバード大学の講義を無料で聞けます。地球の裏側にいる人とリアルタイムで話せます。自分の作った動画を世界中に発信できます。文字通り、世界を手のひらに乗せているんです。\n\n独学でプログラミングを覚えてアプリを作り、億単位（おくたんい）の資金（しきん）を集めた10代。YouTubeで英語を覚えて海外で活躍する人。SNSで発信して仕事を得るフリーランス。スマホとインターネットは**「どこに生まれたか」「親がどんな仕事か」に関係なく、チャンスを手にする可能性を広げました。**\n\nでも同時に、深刻な問題も生んでいます。\n\nスマホの平均利用時間は1日4〜5時間。年間にすると約1,500〜1,800時間。何かの専門スキルを身につけるのに必要な時間は約1,000時間と言われています。つまり**スマホをダラダラ見ている時間で、毎年ひとつの専門スキルが身につく計算**です。\n\nSNSは人のメンタルに影響を与えます。他人のキラキラした投稿を見て自分と比べてしまう。通知が来るたびに集中が途切れる。寝る前のスマホで睡眠の質が落ちる。\n\nスマホは「最強の道具」です。でも道具は使い方次第。ナイフで美味しい料理も作れるし、人を傷つけることもできる。**スマホを「自分の人生を広げるための道具」として使うか、「時間を吸い取る装置」にしてしまうか。その選択は、あなた次第です。**"

  {
    "num":"17","title":"あなたはすでに騙されている——フィルターバブルとフェイクニュース",
    "part":"第4部　情報と言葉のルール","partColor":"num-p4",
    "body":"TikTokの「おすすめ」はなぜあんなに自分の好みにぴったりなのか。それはAIがあなたの行動を観察しているからです。何秒間その動画を見たか、いいねを押したか、スキップしたか。すべてのデータを分析して「この人はこういう動画が好きだ」と学習し、好みに合う動画だけを優先表示します。\n\n便利に見えますが、ここに大きな落とし穴があります。**「フィルターバブル」**と呼ばれる現象です。\n\nフィルターバブルとは、自分の好みに合った情報しか届かなくなり、**まるでシャボン玉（バブル）の中に閉じ込められたように世界が狭くなってしまうこと**です。自分の意見に近いニュースばかりが並び、反対意見に触れる機会がどんどん減っていきます。\n\n**「エコーチェンバー（こだま部屋）」**も深刻です。同じ意見の人が集まるSNSのグループでは、意見がこだまのように反響（はんきょう）して増幅（ぞうふく＝どんどん大きくなること）される。かんたんに言うと、同じ考えの人たちの中にいると「やっぱり自分は正しい」とどんどん思い込みが強くなるんです。「みんなそう言ってるし」と確信しますが、実は外の世界ではまったく違う意見が主流かもしれません。\n\n「フェイクニュース」（ウソのニュース）の問題はさらに怖い。研究によると、**ウソの情報は真実より6倍速く広がる**そうです。ウソのほうが刺激的で感情を揺さぶるから。SNSは「正しいか」ではなく「刺激が強いか」で情報が拡散（かくさん＝広がること）するんです。\n\nでは、どうやって身を守るか。具体的なテクニックを紹介します。\n\nひとつ目、**「ソース（情報の出どころ）を確認する」。**その情報はだれが発信しているか。新聞社？専門家？名前も顔も出していない匿名のアカウント？\n\nふたつ目、**「反対意見を探す」。**ある情報に出会ったら、あえて反対の意見を検索してみる。両方を見てから判断する。\n\nみっつ目、**「日付を確認する」。**古い情報が「最新ニュース」のように拡散されていることがよくあります。\n\nよっつ目、**「感情が動いたら立ち止まる」。**怒り、恐怖、驚き。強い感情を感じたときこそ「これは本当か」と疑う。フェイクニュースは感情を狙い撃ちにしてきます。\n\n**「マジか！」と思ったとき、拡散ボタンを押す前に3秒だけ止まってください。その3秒が、デマの拡散を止める力を持っています。**"
  },
  {
    "num":"18","title":"たった一言が人を殺すこともある",
    "part":"第4部　情報と言葉のルール","partColor":"num-p4",
    "body":"「死ね」。たったふた文字です。でもこの言葉を向けられたとき、人の心に何が起きるか。胸が締めつけられ、頭が真っ白になり、何日もその言葉が頭から離れなくなることがあります。\n\n逆に「あなたがいてくれてよかった」。この一言で、どれだけ救われるか。つらい日々を乗り越えられるだけの力を、たった一言がくれることがあります。\n\n**言葉は目に見えません。手で触ることもできません。でも人を生かすことも、殺すこともできる。**それほど強い力を持ったものです。\n\nSNSの時代になって、言葉の暴力はさらに深刻になりました。面と向かっては言えないような残酷な言葉が、匿名（とくめい＝名前を隠すこと）のアカウントから飛んでくる。画面の向こうに生身の人間がいることを忘れて、軽い気持ちで「キモい」「消えろ」と書き込む。でもその言葉を受け取った側は、何ヶ月も苦しむかもしれません。実際に、**SNSでの誹謗中傷（ひぼうちゅうしょう＝根拠のない悪口や、相手を傷つける書き込み）が原因で命を絶った**方もいます。\n\n**言葉が怖いのは「一度発したら取り消せない」こと**です。「ごめん、言い過ぎた」と謝っても、相手の心についた傷は消えません。\n\nでも同時に、言葉には人を救う力があります。落ち込んでいるとき「大丈夫？」と声をかけてもらえただけで楽になった経験はありませんか。「がんばってるの知ってるよ」「あなたは間違ってないよ」。**何気ない一言が、だれかの人生を支えていることがあります。**\n\n言葉を大切に使うとはどういうことか。それは**「自分が発する言葉の先に、生身の人間がいる」と想像すること**です。LINEを送る前に1秒だけ考える。「これを自分が受け取ったらどう感じるか」。SNSに書き込む前に1秒だけ想像する。「この言葉の先に、だれかの日常がある」。\n\n言葉は無料です。でもその価値は使い方次第で無限にもゼロにもなります。**あなたの一言で、だれかの一日が変わるかもしれません。**"
  },
  {
    "num":"19","title":"「科学を信じる」とはどういうことか",
    "part":"第4部　情報と言葉のルール","partColor":"num-p4",
    "body":"「科学的に証明されています」。この言葉を聞くと、なんとなく安心しますよね。でも「科学を信じる」とはいったいどういうことなのでしょうか。\n\n大事なのは、科学は**「絶対的な真実」ではなく「現時点で最も確からしい説明」**だということです。新しい証拠が見つかれば定説がひっくり返ることもあります。\n\nかつて太陽が地球のまわりを回っている「天動説（てんどうせつ）」が常識でした。教会も科学者もそう信じていた。コペルニクスやガリレオが地動説（地球のほうが回っている、という説）を唱えたとき、彼らは異端者（いたんしゃ＝みんなと違うことを言う「おかしなやつ」）とされました。ガリレオは裁判にかけられ有罪になっています。でも結局、地球が回っていました。\n\n科学の強みは**「反証可能性（はんしょうかのうせい）」**にあります。むずかしい言葉ですが、意味はシンプルです。**「自分の説が間違っているかもしれない」という前提に立って、つねに検証（本当にそうか確かめること）を続ける姿勢**のことです。「絶対に正しい、疑うな」は科学の態度ではなく、むしろカルト（盲目的に信じ込ませる集団）の態度です。\n\n今、科学をめぐって深刻な問題が起きています。「ワクチンは有害だ」「温暖化（おんだんか＝地球の気温がどんどん上がっていくこと）はウソだ」「5Gが病気を起こす」。科学的な根拠はほとんどないのに、SNSで急速に広がっています。\n\n**陰謀論（いんぼうろん）**が厄介なのは、反論すればするほど「やっぱり隠しているんだ」と解釈されてしまうことです。論理ではなく感情に訴えかけるので非常に強い。\n\nどうすればいいか。**「科学リテラシー」**（科学の情報を正しく読み解く力）を身につけることです。情報に出会ったとき「出どころは？」「言っているのは専門家？匿名のアカウント？」「反対意見は？」「データの裏付けは？」と自問する。\n\n科学を盲信（もうしん＝何も疑わずに信じること）するのでもなく否定するのでもなく**「批判的に理解する」**こと。これは科学のことだけではなく、あらゆる情報との付き合い方の基本です。衝撃的な情報を見たとき、すぐに「マジか！」と拡散する前に3秒だけ立ち止まる。その3秒が、あなたを**「情報に使われる人」から「情報を使いこなす人」**に変えてくれます。"
  },
  {

// ---- APP LOGIC ----
let openSet = new Set();

function escH(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function renderBody(raw) {
  let s = escH(raw);
  s = s.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  return s;
}

function toggle(i) {
  const card = document.querySelector(`.ch[data-i="${i}"]`);
  const body = document.getElementById('b-' + i);
  if (!card || !body) return;
  const idx = String(i);
  if (openSet.has(idx)) {
    openSet.delete(idx);
    card.classList.remove('op');
    body.style.maxHeight = '0';
  } else {
    openSet.add(idx);
    card.classList.add('op');
    body.style.maxHeight = body.scrollHeight + 'px';
  }
}

function buildAll() {
  const main = document.getElementById('main');
  const toc = document.getElementById('toc');
  let mh = '', th = '';

  DATA.forEach((ch, i) => {
    // Part header
    if (i === 0 || DATA[i].part !== DATA[i-1].part) {
      th += `<li class="part-label">${DATA[i].part}</li>`;
      mh += `<div class="part-hd">${DATA[i].part}</div>`;
    }

    // TOC item
    th += `<li class="ti" data-i="${i}">第${ch.num}話　${ch.title}</li>`;

    // Card
    mh += `<div class="ch" data-i="${i}" style="animation-delay:${i * 0.025}s">
      <div class="ch-h" onclick="toggle(${i})">
        <div style="display:flex;align-items:flex-start">
          <span class="ch-num ${ch.partColor}">第${ch.num}話</span>
          <h3>${ch.title}</h3>
        </div>
        <span class="chv">▾</span>
      </div>
      <div class="ch-b" id="b-${i}"><div class="ch-bi">`;

    const paras = ch.body.split(/\n\n+/);
    paras.forEach(p => {
      const lines = p.split('\n').map(l => l.trim()).filter(l => l);
      if (lines.length) {
        mh += `<p>${lines.map(l => renderBody(l)).join('<br>')}</p>`;
      }
    });

    mh += `</div></div></div>`;
  });

  main.innerHTML = mh;
  toc.innerHTML = th;

  // TOC click handlers
  toc.querySelectorAll('.ti').forEach(li => {
    li.addEventListener('click', () => {
      const idx = li.dataset.i;
      const card = document.querySelector(`.ch[data-i="${idx}"]`);
      if (card) {
        card.scrollIntoView({ behavior: 'smooth', block: 'start' });
        if (!openSet.has(idx)) toggle(parseInt(idx));
      }
    });
  });
}

// Search
let st;
document.getElementById('si').addEventListener('input', () => {
  clearTimeout(st);
  st = setTimeout(doSearch, 300);
});
document.getElementById('cs').addEventListener('click', closeS);
document.getElementById('sov').addEventListener('click', e => {
  if (e.target.id === 'sov') closeS();
});

function doSearch() {
  const q = document.getElementById('si').value.trim();
  if (q.length < 2) { closeS(); return; }
  const results = [];
  DATA.forEach((ch, i) => {
    const all = ch.title + ' ' + ch.body;
    if (all.includes(q)) {
      const pos = ch.body.indexOf(q);
      const start = Math.max(0, pos - 30);
      const end = Math.min(ch.body.length, pos + q.length + 50);
      let snip = (start > 0 ? '…' : '') + ch.body.slice(start, end) + (end < ch.body.length ? '…' : '');
      snip = escH(snip).replace(
        new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'), 'g'),
        `<mark>${q}</mark>`
      );
      results.push({ i, title: `第${ch.num}話　${ch.title}`, snip });
    }
  });

  document.getElementById('sc').textContent = results.length + '件';
  const list = document.getElementById('srl');
  if (!results.length) {
    list.innerHTML = '<div class="no-r">見つかりませんでした</div>';
  } else {
    list.innerHTML = results.map(r =>
      `<div class="sr-i" data-i="${r.i}"><div class="t">${escH(r.title)}</div><div class="s">${r.snip}</div></div>`
    ).join('');
    list.querySelectorAll('.sr-i').forEach(el => {
      el.addEventListener('click', () => {
        const idx = parseInt(el.dataset.i);
        closeS();
        document.getElementById('si').value = '';
        setTimeout(() => {
          const card = document.querySelector(`.ch[data-i="${idx}"]`);
          if (card) {
            if (!openSet.has(String(idx))) toggle(idx);
            setTimeout(() => card.scrollIntoView({ behavior: 'smooth', block: 'start' }), 100);
          }
        }, 50);
      });
    });
  }
  document.getElementById('sov').classList.add('show');
}

function closeS() {
  document.getElementById('sov').classList.remove('show');
}

// Font size toggle
document.querySelectorAll('.ftog button').forEach(b => {
  b.addEventListener('click', () => {
    document.querySelectorAll('.ftog button').forEach(x => x.classList.remove('on'));
    b.classList.add('on');
    document.body.className = '';
    if (b.dataset.s === 's') document.body.classList.add('fs-s');
    if (b.dataset.s === 'l') document.body.classList.add('fs-l');
  });
});

// Header scroll shadow
window.addEventListener('scroll', () => {
  document.getElementById('hdr').classList.toggle('sc', scrollY > 10);
  // Progress bar
  const h = document.documentElement.scrollHeight - window.innerHeight;
  const pct = h > 0 ? (scrollY / h * 100) : 0;
  document.getElementById('pb').style.width = pct + '%';
});

// Keyboard shortcuts
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeS();
  if ((e.ctrlKey || e.metaKey) && e.key === 'k') {
    e.preventDefault();
    document.getElementById('si').focus();
  }
});

// Active TOC tracking
const observer = new IntersectionObserver(entries => {
  entries.forEach(entry => {
    if (entry.isIntersecting) {
      const idx = entry.target.dataset.i;
      document.querySelectorAll('.ti').forEach(t => t.classList.remove('on'));
      const active = document.querySelector(`.ti[data-i="${idx}"]`);
      if (active) {
        active.classList.add('on');
        active.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
      }
    }
  });
}, { rootMargin: '-60px 0px -70% 0px' });

// Build and observe
buildAll();
document.querySelectorAll('.ch').forEach(ch => observer.observe(ch));
</script>
